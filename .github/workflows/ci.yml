name: MLOps Practical CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  experiment-09-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: experiment-09-ci
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install experiment dependencies
        run: python -m pip install -r requirements.txt
      - name: Run Experiment 9 tests
        run: python -m pytest -v
